name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    # Unit tests only: the integration suite needs the Firestore emulator (Java +
    # firebase-tools) and a Docker daemon for the sandbox.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test apps/api/CodeSync.Tests --filter "Category!=Integration"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npm test -- --watch=false --browsers=ChromeHeadless
