<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="brand">CodeSync</h1>
      <p class="subtitle">Creá tu cuenta gratuita</p>
    </div>

    @if (error()) {
      <app-error-message [message]="error()!" />
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@email.com"
          [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="field-error">Email requerido y válido</span>
        }
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Mínimo 6 caracteres"
          [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="field-error">Mínimo 6 caracteres</span>
        }
      </div>

      <div class="field">
        <label for="confirmPassword">Repetir contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Repetí tu contraseña"
          [class.invalid]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched"
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) {
          <span class="btn-spinner" aria-hidden="true"></span>
        } @else {
          Crear cuenta
        }
      </button>
    </form>

    <p class="auth-link">
      ¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a>
    </p>
  </div>
</div>
