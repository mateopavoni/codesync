<!-- Skip link (a11y — WCAG 2.4.1) -->
<a href="#main-content" class="skip-link">Saltar al contenido</a>

@if (showShell$ | async) {
  @let user = (currentUser$ | async)!;
  <!-- Sidebar (desktop) -->
  <nav class="app-sidebar" aria-label="Navegación principal">
    <!-- Brand -->
    <a routerLink="/" class="sidebar-brand">
      <span class="material-symbols-outlined sidebar-icon" aria-hidden="true"
            style="font-variation-settings: 'FILL' 1;">code_blocks</span>
      <div>
        <span class="sidebar-brand-name">CodeSync</span>
        <span class="sidebar-brand-sub">IDE Colaborativo</span>
      </div>
    </a>

    <!-- CTA nueva sala -->
    <div class="sidebar-cta-wrap">
      <a routerLink="/colaboracion" class="sidebar-cta">
        <span class="material-symbols-outlined" aria-hidden="true"
              style="font-size: 16px;">add</span>
        Nueva sala
      </a>
    </div>

    <!-- Links de navegación -->
    <ul class="sidebar-nav" role="list">
      <li>
        <a routerLink="/dashboard"
           routerLinkActive="active"
           [ariaCurrentWhenActive]="'page'"
           class="sidebar-link">
          <span class="material-symbols-outlined" aria-hidden="true">dashboard</span>
          Dashboard
        </a>
      </li>
      <li>
        <a routerLink="/desafios"
           routerLinkActive="active"
           [ariaCurrentWhenActive]="'page'"
           class="sidebar-link">
          <span class="material-symbols-outlined" aria-hidden="true">assignment</span>
          Desafíos
        </a>
      </li>
      <li>
        <a routerLink="/colaboracion"
           routerLinkActive="active"
           [ariaCurrentWhenActive]="'page'"
           class="sidebar-link">
          <span class="material-symbols-outlined" aria-hidden="true">groups</span>
          Salas
        </a>
      </li>
    </ul>

    <!-- Separador -->
    <div class="sidebar-divider" role="separator" aria-hidden="true"></div>

    <!-- Avatar + nombre del usuario (togglea menú Perfil/Salir) -->
    <div class="sidebar-user-wrap">
      <button type="button"
              class="sidebar-user"
              (click)="toggleUserMenu()"
              [attr.aria-expanded]="userMenuOpen()"
              aria-haspopup="true">
        @if (user.photoURL) {
          <img [src]="user.photoURL"
               [alt]="user.displayName ?? 'Avatar'"
               class="sidebar-avatar" />
        } @else {
          <div class="sidebar-avatar-placeholder" aria-hidden="true">
            {{ (user.displayName ?? user.email ?? 'U')[0].toUpperCase() }}
          </div>
        }
        <span class="sidebar-username" [title]="user.displayName ?? user.email ?? ''">
          {{ user.displayName ?? user.email }}
        </span>
        <span class="material-symbols-outlined sidebar-user-caret" aria-hidden="true">expand_more</span>
      </button>

      @if (userMenuOpen()) {
        <div class="sidebar-user-menu" role="menu">
          <a routerLink="/perfil"
             role="menuitem"
             class="sidebar-link"
             (click)="closeUserMenu()">
            <span class="material-symbols-outlined" aria-hidden="true">person</span>
            Perfil
          </a>
          <button type="button" class="sidebar-logout" role="menuitem" (click)="onLogout()">
            <span class="material-symbols-outlined" aria-hidden="true">logout</span>
            Salir
          </button>
        </div>
      }
    </div>
  </nav>

  <!-- Top bar móvil (visible solo en < 768px) -->
  <div class="mobile-topbar" role="banner">
    <a routerLink="/" class="mobile-brand">CodeSync</a>
    <nav class="mobile-nav" aria-label="Navegación móvil">
      <a routerLink="/dashboard" routerLinkActive="mobile-link--active" class="mobile-link"
         aria-label="Dashboard">
        <span class="material-symbols-outlined">dashboard</span>
      </a>
      <a routerLink="/desafios" routerLinkActive="mobile-link--active" class="mobile-link"
         aria-label="Desafíos">
        <span class="material-symbols-outlined">assignment</span>
      </a>
      <a routerLink="/colaboracion" routerLinkActive="mobile-link--active" class="mobile-link"
         aria-label="Salas">
        <span class="material-symbols-outlined">groups</span>
      </a>
    </nav>
    <button type="button" class="mobile-logout" (click)="onLogout()" aria-label="Cerrar sesión">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
}

<main id="main-content"
      class="app-main"
      [class.with-sidebar]="(showShell$ | async)">
  <router-outlet />
</main>
